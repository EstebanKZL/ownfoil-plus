name: Desktop builds

# Ownfoil-Plus as a program for Windows, macOS and Linux, attached to each release.
#
# A program built with PyInstaller only runs on the system it was built on, so each one
# is built on its own runner: Windows x64 and ARM, macOS with Apple chip and Intel, Linux
# x64 and ARM 64 (a Raspberry Pi 4/5 with a 64-bit system). Raspberry Pi with a 32-bit
# system keeps the Docker image. Each build is started once and asked for its health
# before it's uploaded, so a release never carries a program that doesn't start.
#
# Releases are immutable once published (no file can be added or swapped afterwards), so
# the programs go into the release while it is still a draft:
#   1. gh release create <version> --draft --target <full SHA> --notes-file <notes>
#   2. gh workflow run desktop.yml -f tag=<version>
#   3. when every build is green: gh release edit <version> --draft=false
# Publishing creates the tag, which starts the Docker workflow. This workflow doesn't
# publish by itself: a tag made with the workflow's own token starts no other workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release to attach the programs to (e.g. 6.2.5.60)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Find the draft
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.draft) \(.target_commitish)\"")
          if [ -z "$found" ]; then echo "No release $TAG: create it as a draft first."; exit 1; fi
          read -r draft target <<< "$found"
          if [ "$draft" != true ]; then echo "$TAG is already published: a published release takes no new files."; exit 1; fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, archive: zip}
          - {name: windows-arm64, os: windows-11-arm, archive: zip}
          - {name: macos-apple, os: macos-15, archive: tar.gz}
          - {name: macos-intel, os: macos-15-intel, archive: tar.gz}
          - {name: linux-x64, os: ubuntu-latest, archive: tar.gz}
          - {name: linux-arm64, os: ubuntu-24.04-arm, archive: tar.gz}
    env:
      TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: pyinstaller packaging/ownfoil.spec --noconfirm

      - name: Start it once
        run: |
          cd dist/Ownfoil-Plus
          if [ -f Ownfoil-Plus.exe ]; then program=./Ownfoil-Plus.exe; else program=./Ownfoil-Plus; fi
          "$program" --no-browser > ../start.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8465/api/health; then ok=1; break; fi
            sleep 2
          done
          # Its worker processes too: on Windows, kill stops only the main one, and the
          # workers keep the database open.
          if [ -f Ownfoil-Plus.exe ]; then taskkill //F //T //IM Ownfoil-Plus.exe > /dev/null 2>&1 || true; fi
          kill $pid 2>/dev/null || true
          # What the check created (its config and data) doesn't ship; the files are free
          # once every process has exited.
          for i in $(seq 1 15); do
            rm -rf config data ownfoil.bat 2>/dev/null && break
            sleep 2
          done
          rm -rf config data ownfoil.bat
          if [ -z "$ok" ]; then tail -50 ../start.log; exit 1; fi

      - name: Pack
        id: pack
        run: |
          name="Ownfoil-Plus-${TAG}-${{ matrix.name }}.${{ matrix.archive }}"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "../$name" Ownfoil-Plus > /dev/null
          else
            tar -czf "../$name" Ownfoil-Plus
          fi
          cd ..
          if command -v sha256sum > /dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.pack.outputs.name }}" "${{ steps.pack.outputs.name }}.sha256" --clobber
