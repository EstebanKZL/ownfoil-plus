name: Desktop builds

# Ownfoil-Plus as a program for Windows, macOS and Linux, attached to each release.
#
# A program built with PyInstaller only runs on the system it was built on, so each one
# is built on its own runner: Windows x64 and ARM, macOS with Apple chip and Intel, Linux
# x64 and ARM 64 (a Raspberry Pi 4/5 with a 64-bit system). Raspberry Pi with a 32-bit
# system keeps the Docker image. Each build is started once and asked for its health
# before it's uploaded, so a release never carries a program that doesn't start.
#
# Triggered by publishing a release (the tag the Docker workflow publishes too), or by
# hand: `tag` is the release to attach the programs to, and `ref` what to build - the tag
# itself by default, or a branch (a release made before these builds existed has no
# packaging/ in its tag: built from main, which holds it, then attached to it).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the programs to'
        required: true
      ref:
        description: 'What to build (default: the tag)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, archive: zip}
          - {name: windows-arm64, os: windows-11-arm, archive: zip}
          - {name: macos-apple, os: macos-14, archive: tar.gz}
          - {name: macos-intel, os: macos-15-intel, archive: tar.gz}
          - {name: linux-x64, os: ubuntu-latest, archive: tar.gz}
          - {name: linux-arm64, os: ubuntu-24.04-arm, archive: tar.gz}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: pyinstaller packaging/ownfoil.spec --noconfirm

      - name: Start it once
        run: |
          cd dist/Ownfoil-Plus
          if [ -f Ownfoil-Plus.exe ]; then program=./Ownfoil-Plus.exe; else program=./Ownfoil-Plus; fi
          "$program" --no-browser > ../start.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8465/api/health; then ok=1; break; fi
            sleep 2
          done
          kill $pid 2>/dev/null || true
          sleep 2
          # What the check created (its config and data) doesn't ship.
          rm -rf config data ownfoil.bat
          if [ -z "$ok" ]; then tail -50 ../start.log; exit 1; fi

      - name: Pack
        id: pack
        run: |
          name="Ownfoil-Plus-${TAG}-${{ matrix.name }}.${{ matrix.archive }}"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "../$name" Ownfoil-Plus > /dev/null
          else
            tar -czf "../$name" Ownfoil-Plus
          fi
          cd ..
          if command -v sha256sum > /dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.pack.outputs.name }}" "${{ steps.pack.outputs.name }}.sha256" --clobber
