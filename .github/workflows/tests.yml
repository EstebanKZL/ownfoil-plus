name: Tests

# Runs the whole test suite on every push and pull request, and is also called by
# docker.yml before it builds: an image is only ever published from code that passes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to test (docker.yml passes the version it builds).
        type: string
        default: ''
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty on push / pull_request: the commit that triggered the run.
          ref: ${{ inputs.ref }}

      - name: Set up Python (same version as the Docker image)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -rfE
