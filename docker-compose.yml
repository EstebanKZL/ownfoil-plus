version: "3"

services:
  ownfoil-plus:
    container_name: ownfoil-plus
    image: estebankzl/ownfoil-plus:latest
    environment:
      # For write permission in config directory
      - PUID=1000
      - PGID=1000
      # to create/update an admin user at startup
      # - USER_ADMIN_NAME=admin
      # - USER_ADMIN_PASSWORD=asdvnf!546
      # to create/update a regular user at startup
      # - USER_GUEST_NAME=guest
      # - USER_GUEST_PASSWORD=oerze!@8981
      # account emails (registration, password reset) - see Install.md
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_SECURITY=TLS
      # - SMTP_USER=shop@example.com
      # - SMTP_PASSWORD=
      # - SMTP_FROM=shop@example.com
      # "Sign in with Google" - see Install.md
      # - GOOGLE_CLIENT_ID=
      # - GOOGLE_CLIENT_SECRET=
      # - GOOGLE_REDIRECT_URI=https://shop.example.com/login/google/callback
    volumes:
      - /your/game/directory:/games
      - ./config:/app/config
      - ./data:/app/data
    ports:
      - "8465:8465"
    # LAN discovery (Services > Enable automatic discovery, so Sphaira finds this shop on
    # the network with no address to type in) needs a UDP port reachable on the LAN, which
    # port-mapping alone does not provide. Uncomment the line below (and remove "ports"
    # above, it's ignored with host networking) to enable it:
    # network_mode: host