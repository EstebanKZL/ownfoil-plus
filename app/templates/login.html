{% extends "base.html" %}

{% block content %}
<main class="auth-page">
    <div class="surface auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='logo/logo.svg') }}" width="72" height="72" alt="">
            <h1 class="h4 mb-0">{{ shop_name }}</h1>
            <p class="text-secondary mb-0">{{ t('login.please_login') }}</p>
        </div>
        <form method="POST" action="/login">
            {% if error %}
            <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label small text-secondary" for="exampleInputEmail1">{{ t('login.username') }}</label>
                <input class="form-control" name="user" id="exampleInputEmail1" value="{{ username or '' }}" autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label small text-secondary" for="exampleInputPassword1">{{ t('login.password') }}</label>
                <input type="password" class="form-control" id="exampleInputPassword1" name="password" autocomplete="current-password" {% if username %}autofocus{% endif %}>
            </div>
            <div class="mb-4 form-check">
                <input type="checkbox" name="remember" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">{{ t('login.remember_me') }}</label>
            </div>
            <div class="d-grid">
                <input type="hidden" name="next" value="{{ next_url or '' }}">
                <button type="submit" class="btn btn-primary">{{ t('login.submit') }}</button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
