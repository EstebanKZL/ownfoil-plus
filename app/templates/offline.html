{% extends "base.html" %}

{% block content %}
<main class="auth-page">
    <div class="surface auth-card">
        <div class="empty-state">
            <img src="{{ url_for('static', filename='logo/logo.svg') }}" width="64" height="64" alt="" class="mb-2">
            <h3>{{ t('offline.title') }}</h3>
            <p class="mb-2">{{ t('offline.body') }}</p>
            <button type="button" class="btn btn-primary" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i> {{ t('offline.retry') }}
            </button>
        </div>
    </div>
</main>
{% endblock %}
