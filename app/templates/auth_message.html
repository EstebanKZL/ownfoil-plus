{% extends "base.html" %}

{% block content %}
{# One message after an account step: email sent, link used, link expired... #}
<main class="auth-page">
    <div class="surface auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='logo/logo.svg') }}" width="72" height="72" alt="">
            <h1 class="h4 mb-0">{{ heading }}</h1>
        </div>
        <p class="auth-text">{{ text }}</p>
        <div class="d-grid">
            <a class="btn btn-primary" href="/">{{ t('auth.continue') }}</a>
        </div>
    </div>
</main>
{% endblock %}
