{% extends "base.html" %}


{% block content %}
{% include 'nav.html' %}
<div id="content" class="container-fluid library-page">

    <header class="page-head">
        <span class="page-head__icon"><i class="bi bi-grid" aria-hidden="true"></i></span>
        <h1 class="page-head__title">{{ t('library.title') }} <span class="page-head__count" id="libraryCount" hidden></span></h1>
        <p class="page-head__desc">{{ t('library.subtitle') }}</p>
    </header>

    <div class="stat-grid library-tiles mb-3" id="libraryTiles" hidden></div>
    <div class="library-progress mb-3" id="libraryProgress" hidden>
        <div class="d-flex justify-content-between small mb-1">
            <span class="fw-semibold">{{ t('library.progress_heading') }}</span>
            <span class="text-secondary" id="libraryProgressLabel"></span>
        </div>
        <div class="progress" role="progressbar" aria-label="{{ t('library.progress_heading') }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-bar" style="width: 0%"></div>
        </div>
    </div>

    <div class="row gy-2 gx-3 align-items-center justify-content-md-center">

        <div class="col-auto" id="filterDropdownCol">
            <div class="btn-group dropdown-center" role="group">
                <div class="btn-group" role="group">
                    <button id="filterDropdownBtn" type="button" class="btn btn-primary dropdown-toggle"
                        data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                        <i class="bi bi-funnel-fill"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li>
                            <div class="dropdown-item filter-group-item">
                                <div class="btn-group w-100" role="group" aria-label="Type filter">
                                    <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="typeAll">{{ t('library.filter_all') }}</label>

                                    <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeBase" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="typeBase">{{ t('library.filter_base') }}</label>

                                    <input type="radio" class="btn-check type-toggle" name="typeFilter" id="typeDlc" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="typeDlc">{{ t('library.filter_dlc') }}</label>
                                </div>
                            </div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <div class="dropdown-item filter-group-item">
                                <div class="btn-group w-100" role="group" aria-label="Ownership filter">
                                    <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="ownershipAll">{{ t('library.filter_all') }}</label>

                                    <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipOwned" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="ownershipOwned">{{ t('library.filter_owned') }}</label>

                                    <input type="radio" class="btn-check ownership-toggle" name="ownershipFilter" id="ownershipMissing" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="ownershipMissing">{{ t('library.filter_missing') }}</label>
                                </div>
                            </div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <div class="dropdown-item filter-group-item">
                                <div class="btn-group w-100" role="group" aria-label="Update filter">
                                    <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="updateAll">{{ t('library.filter_all') }}</label>

                                    <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateUpToDate" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="updateUpToDate">{{ t('library.filter_up_to_date') }}</label>

                                    <input type="radio" class="btn-check update-toggle" name="updateFilter" id="updateMissingUpdate" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="updateMissingUpdate">{{ t('library.filter_missing_update') }}</label>
                                </div>
                            </div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <div class="dropdown-item filter-group-item">
                                <div class="btn-group w-100" role="group" aria-label="Completion filter">
                                    <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionAll" autocomplete="off" checked>
                                    <label class="btn btn-outline-primary" for="completionAll">{{ t('library.filter_all') }}</label>

                                    <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionComplete" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="completionComplete">{{ t('library.filter_complete') }}</label>

                                    <input type="radio" class="btn-check completion-toggle" name="completionFilter" id="completionMissingDlc" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="completionMissingDlc">{{ t('library.filter_missing_dlc') }}</label>
                                </div>
                            </div>
                        </li>
                        <!-- <div class="text-center m-2">
                            <button id="btnApplyFilters" type="button" class="btn btn-primary" style="width: 85%;">Apply
                                filters</button>
                        </div> -->
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-auto d-none" id="listHealthFilterCol">
            <div class="btn-group dropdown-center" role="group">
                <button id="listHealthDropdownBtn" type="button" class="btn btn-primary dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-funnel-fill"></i>
                </button>
                <ul class="dropdown-menu">
                    <li>
                        <div class="dropdown-item filter-group-item">
                            <div class="btn-group-vertical w-100" role="group" aria-label="Library health filter">
                                <input type="radio" class="btn-check health-toggle" name="healthFilter" id="healthAll" autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="healthAll">{{ t('library.filter_all') }}</label>

                                <input type="radio" class="btn-check health-toggle" name="healthFilter" id="healthComplete" autocomplete="off">
                                <label class="btn btn-outline-primary" for="healthComplete">{{ t('library.filter_health_complete') }}</label>

                                <input type="radio" class="btn-check health-toggle" name="healthFilter" id="healthIncomplete" autocomplete="off">
                                <label class="btn btn-outline-primary" for="healthIncomplete">{{ t('library.filter_health_incomplete') }}</label>

                                <input type="radio" class="btn-check health-toggle" name="healthFilter" id="healthCorrupt" autocomplete="off">
                                <label class="btn btn-outline-primary" for="healthCorrupt">{{ t('library.filter_health_corrupt') }}</label>

                                <input type="radio" class="btn-check health-toggle" name="healthFilter" id="healthRepack" autocomplete="off">
                                <label class="btn btn-outline-primary" for="healthRepack">{{ t('library.filter_health_repack') }}</label>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-auto">
            <input type="text" id="textFilter" class="form-control" placeholder="{{ t('library.search_placeholder') }}">
        </div>
        <div class="col-auto library-sort">
            <div class="input-group">
                <label class="input-group-text" for="sortField"><i class="bi bi-arrow-down-up" aria-hidden="true"></i><span class="visually-hidden">{{ t('library.sort_label') }}</span></label>
                <select class="form-select" id="sortField">
                    <option value="NAME">{{ t('library.sort_name') }}</option>
                    <option value="RELEASE_DATE">{{ t('library.sort_release_date') }}</option>
                </select>
                <button type="button" class="btn btn-outline-secondary" id="sortDirection" data-direction="ASC"
                        title="{{ t('library.sort_asc') }}" aria-label="{{ t('library.sort_asc') }}"><i class="bi bi-sort-alpha-down"></i></button>
            </div>
        </div>
        <div class="col-auto">
            <div class="btn-group" role="group">
                <button id="view-toggle-btn-card" type="button" class="btn btn-primary view-toggle-btn active" data-view="card"><i
                        class="bi bi-card-heading"></i></button>
                <button id="view-toggle-btn-icon" type="button" class="btn btn-primary view-toggle-btn" data-view="icon"><i
                        class="bi bi-grid-fill"></i></button>
                <button id="view-toggle-btn-list" type="button" class="btn btn-primary view-toggle-btn" data-view="list"><i
                        class="bi bi-list-ul"></i></button>
            </div>
        </div>
        <div class="col-auto">
            <div class="btn-group dropdown-center" role="group">
                <button id="itemsPerPageDropdownBtn" type="button" class="btn btn-primary dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    {{ t('library.items_per_page') }}
                </button>
                <ul class="dropdown-menu" aria-labelledby="itemsPerPageDropdownBtn">
                    <li><button class="dropdown-item items-per-page" data-value="9">9</button></li>
                    <li><button class="dropdown-item items-per-page" data-value="12">12</button></li>
                    <li><button class="dropdown-item items-per-page" data-value="18">18</button></li>
                    <li><button class="dropdown-item items-per-page" data-value="27">27</button></li>
                    <li>
                        <div class="dropdown-item">
                            <input type="number" id="customItemsPerPage" class="form-control" placeholder="{{ t('library.custom_placeholder') }}">
                            <button id="applyCustomItemsPerPage" class="btn btn-primary mt-2">{{ t('library.apply') }}</button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <!-- Card size slider -->
        <div class="col-auto" id="cardSizeRangeCol">
            <!-- <label for="cardSizeRange" class="form-label">Card Size</label> -->
            <input type="range" class="form-range" min="1" max="5" step="1" id="cardSizeRange">
        </div>
    </div>

    <!-- Pagination controls (top) - mirrors the bottom one, same content, so paging
         doesn't require scrolling all the way down first. -->
    <nav aria-label="Page navigation" class="mt-3">
        <ul class="pagination justify-content-center" id="paginationControlsTop"></ul>
    </nav>

    <div class="grid-container" id="gridContainer">
        <div class="row g-3" id="gameGrid"></div>
        <!-- <div class="row row-cols-1 row-cols-md-3 g-4" id="gameGrid"></div> -->
    </div>

    <!-- Pagination controls (bottom) -->
    <nav aria-label="Page navigation" class="mt-3">
        <ul class="pagination justify-content-center" id="paginationControlsBottom"></ul>
    </nav>

    <!-- Metadata for a base game, update or DLC, opened from the List view. -->
    <div class="modal fade" id="metadataModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="metadataModalLabel">{{ t('library.details') }}</h5>
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" id="metadataEditBtn" class="btn btn-sm icon-btn p-0 d-none" data-bs-toggle="tooltip" data-bs-placement="top" title="{{ t('library.metadata_edit') }}"><i class="bi bi-pencil"></i></button>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body" id="metadataModalBody"></div>
                <div class="modal-footer d-none" id="metadataEditFooter">
                    <button type="button" class="btn btn-sm btn-outline-danger me-auto" id="metadataResetBtn">{{ t('library.metadata_reset') }}</button>
                    <button type="button" class="btn btn-sm btn-secondary" id="metadataCancelEditBtn">{{ t('library.metadata_cancel') }}</button>
                    <button type="button" class="btn btn-sm btn-primary" id="metadataSaveBtn">{{ t('library.metadata_save') }}</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/format.js') }}"></script>
<script>
    // The grid is served page by page: every render is one GraphQL call for exactly the
    // items on screen. Filters, search and ordering are query arguments, so a page of
    // N is always N items, whatever the filters.
    // Fed by the server, so the List view's download button follows the same admin +
    // Settings-toggle gate the /api/library/download/<id> route itself enforces -
    // this only controls whether the button is drawn, not the actual authorization.
    const IS_ADMIN = {{ is_admin | tojson }};
    const IS_SHOP = {{ is_shop | tojson }};
    const WEB_DOWNLOADS_ENABLED = {{ web_downloads_enabled | tojson }};
    // Library > Organizer > "Show game background image in Library list view" setting -
    // only gates the .list-banner-strip behind each row in renderListView; the cover
    // icon (.list-cover) and every other view (card grid, detail popup) are untouched.
    const SHOW_GAME_BACKGROUND_IMAGE = {{ show_game_background_image | tojson }};

    // Strings the JS below needs but can't hardcode in English.
    const I18N = {
        unrecognized: {{ t('library.unrecognized') | tojson }},
        notFoundInTitledb: {{ t('library.not_found_in_titledb') | tojson }},
        versionV0: {{ t('library.version_v0') | tojson }},
        tileGames: {{ t('library.tile_games') | tojson }},
        tileUpdates: {{ t('library.tile_updates') | tojson }},
        tileMissingDlc: {{ t('library.tile_missing_dlc') | tojson }},
        tileSize: {{ t('library.tile_size') | tojson }},
        progress: {{ t('library.progress') | tojson }},
        updatesTooltip: {{ t('library.updates_tooltip') | tojson }},
        previous: {{ t('library.previous') | tojson }},
        next: {{ t('library.next') | tojson }},
        owned: {{ t('library.owned') | tojson }},
        missing: {{ t('library.missing') | tojson }},
        baseGame: {{ t('library.base_game') | tojson }},
        updatesSection: {{ t('library.updates_section') | tojson }},
        dlcSection: {{ t('library.dlc_section') | tojson }},
        olderVersionsOne: {{ t('library.older_versions_one') | tojson }},
        olderVersionsMany: {{ t('library.older_versions_many') | tojson }},
        latestVersion: {{ t('library.latest_version') | tojson }},
        developer: {{ t('library.developer') | tojson }},
        publisher: {{ t('library.publisher') | tojson }},
        releaseDate: {{ t('library.release_date') | tojson }},
        numberOfPlayers: {{ t('library.number_of_players') | tojson }},
        genre: {{ t('library.genre') | tojson }},
        rating: {{ t('library.rating') | tojson }},
        fileSize: {{ t('library.file_size') | tojson }},
        languages: {{ t('library.languages') | tojson }},
        titleIdLabel: {{ t('library.title_id_label') | tojson }},
        typeLabel: {{ t('library.type_label') | tojson }},
        versionLabel: {{ t('library.version_label') | tojson }},
        noMoreMetadata: {{ t('library.no_more_metadata') | tojson }},
        dlcFallbackName: {{ t('library.dlc_fallback_name') | tojson }},
        detailsTooltip: {{ t('library.details_tooltip') | tojson }},
        downloadTooltip: {{ t('library.download_tooltip') | tojson }},
        downloadAria: {{ t('library.download_aria') | tojson }},
        metadataEdit: {{ t('library.metadata_edit') | tojson }},
        metadataNameLabel: {{ t('library.metadata_name_label') | tojson }},
        metadataDeveloperLabel: {{ t('library.metadata_developer_label') | tojson }},
        metadataPublisherLabel: {{ t('library.metadata_publisher_label') | tojson }},
        metadataReleaseDateLabel: {{ t('library.metadata_release_date_label') | tojson }},
        metadataDescriptionLabel: {{ t('library.metadata_description_label') | tojson }},
        metadataEditHint: {{ t('library.metadata_edit_hint') | tojson }},
        metadataSaved: {{ t('library.metadata_saved') | tojson }},
        metadataSaveFailed: {{ t('library.metadata_save_failed') | tojson }},
        metadataResetDone: {{ t('library.metadata_reset_done') | tojson }},
        metadataResetFailed: {{ t('library.metadata_reset_failed') | tojson }},
        sortAsc: {{ t('library.sort_asc') | tojson }},
        sortDesc: {{ t('library.sort_desc') | tojson }},
    };

</script>
<script src="{{ url_for('static', filename='js/library.js') }}"></script>
{% endblock %}
