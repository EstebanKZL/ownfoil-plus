[project]
name = "ownfoil"
version = "6.2.5.58"
description = "Self-hosted Nintendo Switch library manager, with automated management tasks, multi user authentication, serving your library to multiple supported clients on your Switch."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "a1ex4", email = "12754559+a1ex4@users.noreply.github.com" },
]
maintainers = [
    { name = "EstebanKZL" },
]
keywords = ["atmosphere", "homebrew", "nintendo-switch", "self-hosted", "switch", "tinfoil"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "flask==3.1.3",
    "flask-login==0.6.3",
    "flask-migrate==4.1.0",
    "flask-sock==0.7.0",
    "flask-sqlalchemy==3.1.1",
    "gunicorn==26.2.0 ; sys_platform != 'win32'",
    "nstools==2.0.0b7",
    "nsz==5.0.0",
    "pillow==13.0.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "setproctitle==1.3.8",
    "strawberry-graphql[flask]==0.339.1",
    "watchdog==6.0.0",
    "urllib3==2.8.0",
    "werkzeug==3.1.9",
    "zstandard==0.25.0",
]

[project.urls]
Homepage = "https://github.com/EstebanKZL/ownfoil-plus"
Repository = "https://github.com/EstebanKZL/ownfoil-plus"
Issues = "https://github.com/EstebanKZL/ownfoil-plus/issues"
Changelog = "https://github.com/EstebanKZL/ownfoil-plus/blob/main/CHANGELOG.md"
Upstream = "https://github.com/a1ex4/ownfoil"

[project.scripts]
ownfoil = "ownfoil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ownfoil"]

[tool.hatch.build.targets.wheel.force-include]
"app" = "ownfoil/_app"
